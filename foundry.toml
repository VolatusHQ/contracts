[profile.default]
src           = "src"
test          = "test"
script        = "script"
out           = "out"
libs          = ["lib"]

solc_version  = "0.8.26"
evm_version   = "cancun"
via_ir        = true
optimizer     = true
optimizer_runs = 44_444_444
bytecode_hash = "none"

# v4 hook addresses encode permission bits, so tests mine CREATE2 salts.
ffi           = true
fuzz          = { runs = 1_000 }

# Tests do not need via-IR; skipping it cuts compile time substantially.
additional_compiler_profiles = [{ name = "test", via_ir = false }]
compilation_restrictions     = [{ paths = "test/**", via_ir = false }]

[profile.ci]
fuzz = { runs = 50_000 }

[profile.deep]
fuzz = { runs = 250_000 }

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
arc_testnet      = "${ARC_TESTNET_RPC}"

[etherscan]
unichain_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 1301 }
